name: API Tests (Practice 5)

on:
  push:
    paths:
      - 'services/api-tests/**'
      - 'services/pom.xml'
      - 'docker-compose.yaml'
      - '.env.example'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/api-tests/**'
      - 'services/pom.xml'
      - 'docker-compose.yaml'
      - '.env.example'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start the stand
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Wait for Gateway health
        run: |
          for _ in $(seq 1 90); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 2
          done
          docker compose logs --tail=100 gateway
          exit 1

      - name: Run API tests
        run: mvn -B -f services/pom.xml -Papi-tests test

      - name: Stand logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop the stand
        if: always()
        run: docker compose down -v --remove-orphans
